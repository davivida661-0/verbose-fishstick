// ---------------------------------------------------------------------------
// :launcher - launcher standalone do Solar Client
//   - login Microsoft (OAuth device code) / Mojang legado / offline
//   - download do Minecraft 1.8.9 + libraries + OptiFine
//   - bootstrap do Mixin (TransformingClassLoader) e execucao do jogo
// ---------------------------------------------------------------------------
plugins {
    id 'java'
}

application {
    mainClass = 'com.solarclient.launcher.Launcher'
}

archivesBaseName = 'solar-client-launcher'

dependencies {
    implementation "com.google.code.gson:gson:${rootProject.gsonVersion}"

    // ASM sao necessarias em COMPILACAO porque a assinatura de
    // IMixinTransformer.transformClass referencia ClassNode (asm-tree), e em
    // RUNTIME porque o Mixin carrega o verificador (asm-util) na hora de
    // validar as classes transformadas. Sem asm-util o launcher quebra com
    // NoClassDefFoundError: org/objectweb/asm/util/CheckClassAdapter.
    compileOnly "org.ow2.asm:asm:${rootProject.asmVersion}"
    compileOnly "org.ow2.asm:asm-tree:${rootProject.asmVersion}"
    compileOnly "org.ow2.asm:asm-util:${rootProject.asmVersion}"
    compileOnly "org.ow2.asm:asm-commons:${rootProject.asmVersion}"
    compileOnly "org.ow2.asm:asm-analysis:${rootProject.asmVersion}"

    // Mixin e Guava: em runtime porque o launcher SOBE o ambiente do Mixin
    // (sem Forge nem Fabric, entao o proprio launcher e o hospedeiro - ver
    // SolarMixinService). Guava e dependencia do proprio Mixin.
    runtimeOnly "org.spongepowered:mixin:${rootProject.mixinVersion}"
    runtimeOnly "com.google.guava:guava:${rootProject.guavaVersion}"
    runtimeOnly "org.ow2.asm:asm:${rootProject.asmVersion}"
    runtimeOnly "org.ow2.asm:asm-tree:${rootProject.asmVersion}"
    runtimeOnly "org.ow2.asm:asm-util:${rootProject.asmVersion}"
    runtimeOnly "org.ow2.asm:asm-commons:${rootProject.asmVersion}"
    runtimeOnly "org.ow2.asm:asm-analysis:${rootProject.asmVersion}"
}

jar {
    archiveFileName = "${archivesBaseName}-${rootProject.modVersion}.jar"
    manifest {
        attributes('Main-Class': 'com.solarclient.launcher.Launcher')
    }
}

// Roda o launcher com as mesmas libs do Gradle: ./gradlew :launcher:run
run {
    standardInput = System.in
}
