// ---------------------------------------------------------------------------
// Build raiz. Aplica Java 8 + UTF-8 em todos os sub-modulos.
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'java'

    group = 'com.solarclient'
    version = "${modVersion}+mc${minecraftVersion}"

    repositories {
        mavenCentral()
        maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'Minecraft Libraries'; url = 'https://libraries.minecraft.net/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Java 8 estrito: garante que ninguem use API mais nova por engano.
        if (JavaVersion.current().isJava9Compatible()) {
            options.release.set(8)
        } else {
            sourceCompatibility = '1.8'
            targetCompatibility = '1.8'
        }
        options.compilerArgs << '-Xlint:-options'
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                'Implementation-Title': rootProject.name,
                'Implementation-Version': project.version
            )
        }
    }
}

// Tarefa utilitaria: compila so o mod e mostra erros de API.
tasks.register('clientCheck') {
    group = 'verification'
    description = 'Compila apenas o mod (:client).'
    dependsOn ':client:compileJava'
}
