# Versao do mod
modVersion=0.1.0

# Versao do Minecraft suportada
minecraftVersion=1.8.9

# Versoes de libraries (todas compativel com Java 8)
gsonVersion=2.8.9
# Mixin 0.8.5: a versao cujo codigo do launcher foi compilado e verificado.
# O annotation processor dele (:processor) precisa do Guava no classpath de
# compilacao - ver docs/BUILD.md.
mixinVersion=0.8.5
guavaVersion=31.1-jre
lwjglVersion=2.9.4
sqliteVersion=3.42.0.0

# App registrado no Azure Portal (login Microsoft do launcher).
# Vazio = so funciona o modo offline.
microsoftClientId=

# Caminho (relativo a pasta :client) do jar do Minecraft 1.8.9 DECOMPILADO e com
# nomes MCP. Veja docs/BUILD.md - esse arquivo NAO vem no repositorio.
minecraftMappedJar=libs/minecraft-1.8.9-mapped.jar

# URL base da API REST de cosmeticos (usada pelo mod e pelo launcher)
apiBaseUrl=https://api.solarclient.dev
